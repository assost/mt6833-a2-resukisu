name: build-resukisu

on:
  push:
    branches:
      - "oppo/mt6833_t_13.1.1_a2_5g"
    paths:
      - ".github/**"
  workflow_dispatch:

concurrency:
  group: a2-resukisu
  cancel-in-progress: false

jobs:
  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Free disk on the runner
        run: |
          set -eux
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup \
            /opt/hostedtoolcache || true
          sudo apt-get clean
          df -h

      - name: Checkout A2 kernel
        uses: actions/checkout@v4
        with:
          ref: oppo/mt6833_t_13.1.1_a2_5g
          fetch-depth: 1

      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev \
            libelf-dev dwarves python3 ccache rsync curl ca-certificates \
            gcc-aarch64-linux-gnu

      - name: clang-r433403b
        run: |
          set -eux
          git clone --depth 1 --branch 12 \
            https://github.com/AOSP-12/prebuilts_clang_host_linux-x86_clang-r433403b.git \
            "$GITHUB_WORKSPACE/clang"
          test -x "$GITHUB_WORKSPACE/clang/bin/clang"
          test -x "$GITHUB_WORKSPACE/clang/bin/ld.lld"
          "$GITHUB_WORKSPACE/clang/bin/clang" --version
          df -h

      - name: Integrate ReSukiSU and SUSFS
        run: |
          set -eux
          chmod +x .github/scripts/prepare.sh
          bash .github/scripts/prepare.sh

      - name: Build
        run: |
          set -euxo pipefail
          export ARCH=arm64
          export SUBARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export READELF=llvm-readelf
          export STRIP=llvm-strip
          export HOSTCC=clang
          export HOSTLD=ld.lld
          # Preserve diagnostics from legacy vendor/configuration-dependent code.
          export KCFLAGS="-Wno-error=unused-but-set-variable -Wno-error=strict-prototypes -Wno-error=unused-variable -Wno-error=unused-function"
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          make O=out k6833v1_64_k419_defconfig
          cp out/.config out/kernel.config
          {
            git rev-parse HEAD
            git -C KernelSU rev-parse HEAD
            for source in mm/memory.c fs/proc/task_mmu.c; do
              grep -n "SUSFS_IS_INODE_SUS_MAP" "$source"
            done
            grep -n "susfs_is_avc_log_spoofing_enabled" security/selinux/avc.c
          } > out/integration-evidence.txt
          grep -E 'CONFIG_KSU|CONFIG_LTO_CLANG|CONFIG_CFI_CLANG|CONFIG_OPLUS_ROOT_CHECK' out/.config
          test "$(grep -c '^CONFIG_LTO_CLANG=y$' out/.config)" = 1
          test "$(grep -c '^CONFIG_CFI_CLANG=y$' out/.config)" = 1
          test "$(grep -c '^CONFIG_KSU_SUSFS=y$' out/.config)" = 1
          test "$(grep -c '^CONFIG_KSU=y$' out/.config)" = 1
          test "$(grep -c '^CONFIG_KSU_SUSFS_SUS_MAP=y$' out/.config)" = 1
          if grep -q '^CONFIG_KSU_TRACEPOINT_HOOK=y$' out/.config; then
            echo "Unexpected tracepoint hook configuration" >&2
            exit 1
          fi
          make O=out -j2 2>&1 | tee out/build.log
          test "$(stat -c %s out/arch/arm64/boot/Image.gz-dtb)" -gt 1048576
          sha256sum out/arch/arm64/boot/Image.gz-dtb > out/kernel.sha256
          ls -lh out/arch/arm64/boot/Image.gz-dtb

      - name: Upload kernel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a2-kernel-log
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/kernel.config
            out/build.log
            out/integration-evidence.txt
            out/kernel.sha256
          if-no-files-found: warn
