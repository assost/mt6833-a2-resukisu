name: build-resukisu

on:
  push:
    branches:
      - "oppo/mt6833_t_13.1.1_a2_5g"
    paths:
      - ".github/**"
  workflow_dispatch:

concurrency:
  group: a2-resukisu
  cancel-in-progress: false

jobs:
  stock:
    name: Stock configuration baseline
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Free disk on the runner
        run: |
          set -eux
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup \
            /opt/hostedtoolcache || true
          sudo apt-get clean
          df -h

      - name: Checkout A2 kernel
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev \
            libelf-dev dwarves python3 ccache rsync curl ca-certificates \
            gcc-aarch64-linux-gnu libncurses5 libtinfo5

      - name: Checkout factory clang-r383902
        uses: actions/checkout@v4
        with:
          repository: AOSP-10/prebuilts_clang_host_linux-x86_clang-r383902
          ref: 23ba73b5770985b6bf5f38efceba99019178025c
          path: clang
          fetch-depth: 1
          persist-credentials: false

      - name: Verify factory compiler
        run: |
          set -eux
          test -x "$GITHUB_WORKSPACE/clang/bin/clang"
          test -x "$GITHUB_WORKSPACE/clang/bin/ld.lld"
          "$GITHUB_WORKSPACE/clang/bin/clang" --version | tee factory-clang-version.txt
          grep -F "6443078" factory-clang-version.txt
          grep -F "r383902" factory-clang-version.txt
          grep -F "clang version 11.0.1" factory-clang-version.txt

      - name: Prepare stock sources
        run: bash .github/scripts/prepare.sh stock

      - name: Build stock kernel
        run: bash .github/scripts/build_kernel.sh stock

      - name: Upload stock kernel and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a2-stock-kernel
          path: |
            out/arch/arm64/boot/Image.gz
            out/kernel.config
            out/build.log
            out/integration-evidence.txt
            out/kernel.sha256
            out/build-validation.json
            out/vendor-restore-manifest.json
            out/factory-config-audit.json
            out/vdso-build.log
            out/vdso-early-validation.json
            out/vdso-validation.json
            out/arch/arm64/kernel/vdso/vdso.so
            out/builtin-connectivity-report.json
            out/builtin-connectivity-source-manifest.json
            out/builtin-connectivity-source-evidence.zip
            out/builtin-connectivity-commands.json
            out/vmlinux.symbols
            out/System.map
            out/modules.builtin
            out/Module.symvers
          if-no-files-found: warn

  kernel:
    name: ReSukiSU and SUSFS kernel
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Free disk on the runner
        run: |
          set -eux
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup \
            /opt/hostedtoolcache || true
          sudo apt-get clean
          df -h

      - name: Checkout A2 kernel
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev \
            libelf-dev dwarves python3 ccache rsync curl ca-certificates \
            gcc-aarch64-linux-gnu libncurses5 libtinfo5

      - name: Checkout factory clang-r383902
        uses: actions/checkout@v4
        with:
          repository: AOSP-10/prebuilts_clang_host_linux-x86_clang-r383902
          ref: 23ba73b5770985b6bf5f38efceba99019178025c
          path: clang
          fetch-depth: 1
          persist-credentials: false

      - name: Verify factory compiler
        run: |
          set -eux
          test -x "$GITHUB_WORKSPACE/clang/bin/clang"
          test -x "$GITHUB_WORKSPACE/clang/bin/ld.lld"
          "$GITHUB_WORKSPACE/clang/bin/clang" --version | tee factory-clang-version.txt
          grep -F "6443078" factory-clang-version.txt
          grep -F "r383902" factory-clang-version.txt
          grep -F "clang version 11.0.1" factory-clang-version.txt

      - name: Prepare resukisu sources
        run: bash .github/scripts/prepare.sh resukisu

      - name: Build resukisu kernel
        run: bash .github/scripts/build_kernel.sh resukisu

      - name: Upload resukisu kernel and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a2-resukisu-kernel
          path: |
            out/arch/arm64/boot/Image.gz
            out/kernel.config
            out/build.log
            out/integration-evidence.txt
            out/kernel.sha256
            out/build-validation.json
            out/vendor-restore-manifest.json
            out/factory-config-audit.json
            out/vdso-build.log
            out/vdso-early-validation.json
            out/vdso-validation.json
            out/arch/arm64/kernel/vdso/vdso.so
            out/builtin-connectivity-report.json
            out/builtin-connectivity-source-manifest.json
            out/builtin-connectivity-source-evidence.zip
            out/builtin-connectivity-commands.json
            out/vmlinux.symbols
            out/System.map
            out/modules.builtin
            out/Module.symvers
          if-no-files-found: warn
